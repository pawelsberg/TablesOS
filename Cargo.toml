# TablesOS workspace.
#
# The workspace root is also the *image builder*: it takes the freshly
# compiled `kernel` binary (built for the bare-metal `x86_64-unknown-none`
# target via a Cargo artifact-dependency) and wraps it into a BIOS-bootable
# disk image with the `bootloader` crate. See BUILD.md.

[package]
name = "tablesos-builder"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["kernel", "tablestore", "pngdec", "uefi-loader"]
resolver = "2"

# The single source of truth for the TablesOS version. Every crate inherits it
# (`version.workspace = true`), and it is stamped — packed as a u32 via
# `tablestore::VERSION` — into every on-disk version field (MBR boot header,
# volume superblock, journal control header). There are deliberately no
# independent format numbers: a change here is assumed to change every on-disk
# format at once. The displayed form is `tablestore::VERSION_STR` (= "v0.5.0").
#
# Upgrade path: an existing volume of an OLDER version can be brought up to this
# one in place (keeping its data) via the Table List `[u]` "top up version on
# USB" action — see `kernel/src/upgrade.rs` and `tablestore/src/migrate.rs`.
# When bumping this, archive the previous release's seeded image first
# (`cargo run -- --seed --no-run --archive`), so upgrades from it stay testable.
#
# v0.3.0: flash wear-levelling — the hot journal-control and superblock sectors
# now rotate across their regions, and the journal-data images rotate too. The
# on-disk geometry is unchanged and a v0.2.0 volume is read transparently, so
# 0.2.0 → 0.3.0 is a no-op data migration (just a re-stamp + new boot code).
#
# v0.4.0: copy-on-write pager — eliminates ALL flash hot spots. A logical page no
# longer has a fixed physical home; every commit writes changed pages to fresh
# physical pages chosen by a cursor sweeping the whole device, then flips one
# anchor record (rotating across a device-wide ring). This replaces the in-place
# journal entirely. The on-disk format changes fundamentally, so a v0.3.0 volume
# is migrated with data preserved by reading it through the frozen `compat_v3`
# reader and rebuilding it into the new layout (see `migrate.rs` /
# `kernel/src/upgrade.rs`).
#
# v0.5.0: kernel/UI release — Greek/Polish keyboard layouts with dead keys and
# Win+Space switching, boot-time resolution chooser, idle HLT, faster
# framebuffer present. The on-disk CoW format is unchanged from v0.4.0, so
# 0.4.0 → 0.5.0 is a no-op data migration (rebuild + re-stamp via the top-up
# path); the data LBA may still move if the boot prefix size changed.
[workspace.package]
version = "0.5.0"

# The kernel as an artifact dependency, compiled for bare metal. Because it is
# a *normal* dependency, Cargo exposes `CARGO_BIN_FILE_KERNEL_kernel` to this
# crate's own compilation, so the image is built at runtime in `main.rs`
# (Cargo does not forward that variable to build scripts).
[dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
# The UEFI boot loader (BOOTX64.EFI), compiled as a PE binary for the UEFI
# environment and placed on the image's FAT16 EFI System Partition.
uefi-loader = { path = "uefi-loader", artifact = "bin", target = "x86_64-unknown-uefi" }
# Used at build time to lay down an already-formatted volume in the image
# (the OS never formats at runtime).
tablestore = { path = "tablestore" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Cargo builds the `kernel` artifact dependency with the *dev* profile
# regardless of `--release` (a `-Z bindeps` quirk). An unoptimised, debug-info
# kernel is multi-MB, which makes the BIOS bootloader crawl while "loading
# kernel...". Optimise the kernel, the engine AND `pngdec` in every profile so
# the image stays small and boots fast. (Per-package overrides apply to
# artifact deps.) `pngdec` matters in particular: it decodes the embedded
# background/font PNGs at boot, and at the dev default `opt-level = 0` that
# decode is ~12x slower (measured ~350 ms vs ~30 ms per 1168x784 background on
# the host) — which, multiplied again by QEMU's TCG software CPU, is what made
# "loading assets" drag on for seconds.
[profile.dev.package.kernel]
opt-level = 2
debug = false

[profile.dev.package.tablestore]
opt-level = 2
debug = false

[profile.dev.package.pngdec]
opt-level = 2
debug = false

[profile.dev.package.uefi-loader]
opt-level = 2
debug = false

[profile.release.package.kernel]
opt-level = 2
debug = false

[profile.release.package.tablestore]
opt-level = 2
debug = false

[profile.release.package.pngdec]
opt-level = 2
debug = false

[profile.release.package.uefi-loader]
opt-level = 2
debug = false
